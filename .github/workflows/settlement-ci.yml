name: settlement-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  settlement-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: settlement-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install e2a-java at the version the pom pins (no package registry; built from E2A's tag)
        run: |
          E2A="v$(sed -n 's:.*<e2a.version>\(.*\)</e2a.version>.*:\1:p' pom.xml)"
          git clone -q --depth 1 --branch "$E2A" https://github.com/subhamviky/e2a-framework.git "$RUNNER_TEMP/e2a"
          mvn -B -q -f "$RUNNER_TEMP/e2a/java/pom.xml" install -DskipTests
      - name: Start the Service Bus and Pub/Sub emulators (the outbox relay's publishers are tested on them)
        run: |
          docker run -d --name pubsub -p 8681:8681 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud emulators pubsub start --host-port=0.0.0.0:8681 --project=demo-settlement
          bash "$GITHUB_WORKSPACE/.github/start-servicebus-emulator.sh"
          ready=""
          for _ in $(seq 90); do docker logs pubsub 2>&1 | grep -q "Server started" && ready=yes && break; sleep 2; done
          docker logs pubsub 2>&1 | tail -5
          [ -n "$ready" ] || { echo "::error::the Pub/Sub emulator did not start"; exit 1; }
      - name: Build and test (Java 21, H2 in PostgreSQL mode; the Service Bus and Pub/Sub publishers on the emulators)
        env:
          SERVICEBUS_CONNECTION_STRING: "Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
          PUBSUB_EMULATOR_HOST: 127.0.0.1:8681
        run: mvn -B verify
      - name: Keep the events the tests produced, for the contract check
        uses: actions/upload-artifact@v6
        with:
          name: contract-samples
          path: settlement-service/target/contract-samples/

  audit-ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit-ai-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pipx install "poetry>=2.0,<3"
      - run: poetry install --no-interaction
      - run: poetry run pytest -q
      - name: Start the Cosmos DB and Service Bus emulators
        run: |
          docker run -d --name cosmos -p 8081:8081 mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:db53613dae19d0a3d5ad50688d14aa6e957af082dafea56b52e1bd3a6b3f1406
          bash "$GITHUB_WORKSPACE/.github/start-servicebus-emulator.sh"
          for _ in $(seq 90); do docker logs cosmos 2>&1 | grep -q "Gateway=OK" && break; sleep 2; done
      - name: Tests again with the state in Cosmos DB, several replicas on one container, events from Service Bus
        env:
          SERVICEBUS_CONNECTION_STRING: "Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
          AUDIT_STATE_BACKEND: cosmos
          COSMOS_ENDPOINT: http://127.0.0.1:8081
          # the emulator's published, well-known key (not a secret)
          COSMOS_KEY: C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
        run: poetry run pytest -q -rs
      - name: Start the Firestore emulator (GCP-01)
        run: |
          docker run -d --name firestore -p 8086:8086 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8086
          for _ in $(seq 90); do curl -s -o /dev/null http://127.0.0.1:8086/ && break; sleep 2; done
      - name: Tests again with the state in Firestore (the Google Cloud binding, GCP-01)
        env:
          AUDIT_STATE_BACKEND: firestore
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8086
          GOOGLE_CLOUD_PROJECT: demo-audit
        run: poetry run pytest -q -rs
      - name: E2A conformance, strict (v1.3 makes R2 an error; design note V13-01)
        run: poetry run python -m e2a.conformance --strict src
      - name: Release gate (E2A ProjectReleaseGate; evals/golden.json, every case right; pytest ran above)
        run: poetry run python -m audit_ai_service.release.gate --skip-tests --report release-gate-report.json
      - name: Keep the gate report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: audit-release-gate-report
          path: audit-ai-service/release-gate-report.json

  contracts:
    runs-on: ubuntu-latest
    needs: settlement-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.22"
      - uses: actions/download-artifact@v7
        with:
          name: contract-samples
          path: samples
      - name: Real events from settlement-service satisfy the contract
        run: python contracts/tools/validate_samples.py samples/*.json contracts/events/examples/*.json

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: fmt, validate and test against mock providers (no Azure or Google Cloud account)
        run: |
          for dir in settlement-service/infra audit-ai-service/infra landscape-identity settlement-service/infra/gcp audit-ai-service/infra/gcp; do
            echo "== $dir"
            (cd "$dir" && terraform init -backend=false -input=false && terraform fmt -check -recursive && terraform validate && terraform test)
          done

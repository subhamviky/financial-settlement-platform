name: settlement-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  settlement-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: settlement-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install e2a-java at the version the pom pins (no package registry; built from E2A's tag)
        run: |
          E2A="v$(sed -n 's:.*<e2a.version>\(.*\)</e2a.version>.*:\1:p' pom.xml)"
          git clone -q --depth 1 --branch "$E2A" https://github.com/subhamviky/e2a-framework.git "$RUNNER_TEMP/e2a"
          mvn -B -q -f "$RUNNER_TEMP/e2a/java/pom.xml" install -DskipTests
      - name: Build and test (Java 21, H2 in PostgreSQL mode)
        run: mvn -B verify
      - name: Keep the events the tests produced, for the contract check
        uses: actions/upload-artifact@v6
        with:
          name: contract-samples
          path: settlement-service/target/contract-samples/

  audit-ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit-ai-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pipx install "poetry>=2.0,<3"
      - run: poetry install --no-interaction
      - run: poetry run pytest -q
      - name: E2A conformance, strict (v1.3 makes R2 an error; design note V13-01)
        run: poetry run python -m e2a.conformance --strict src
      - name: Release gate (E2A ProjectReleaseGate; evals/golden.json, every case right; pytest ran above)
        run: poetry run python -m audit_ai_service.release.gate --skip-tests --report release-gate-report.json
      - name: Keep the gate report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: audit-release-gate-report
          path: audit-ai-service/release-gate-report.json

  contracts:
    runs-on: ubuntu-latest
    needs: settlement-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.22"
      - uses: actions/download-artifact@v7
        with:
          name: contract-samples
          path: samples
      - name: Real events from settlement-service satisfy the contract
        run: python contracts/tools/validate_samples.py samples/*.json contracts/events/examples/*.json

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: fmt, validate and test against mock providers (no Azure account)
        run: |
          for dir in settlement-service/infra audit-ai-service/infra; do
            echo "== $dir"
            (cd "$dir" && terraform init -backend=false -input=false && terraform fmt -check -recursive && terraform validate && terraform test)
          done

name: aidlc-scaffold

# Runs aidlc-build (E2A AI-DLC pipeline: G2C + P0, then A2C, then E2A checks) for one
# request file and pushes the generated service to the branch aidlc/<project_name>.
# The steps live in a2c-framework as a reusable workflow, so every project runs the same,
# versioned scaffold job instead of a copy of it.
on:
  workflow_dispatch:
    inputs:
      request:
        description: "AI-DLC request file, relative to the repository root"
        required: true
        default: "aidlc/requests/settlement-service.json"
      a2c_ref:
        description: "a2c-framework tag to build with"
        required: true
        default: "v1.2.0"

jobs:
  scaffold:
    permissions:
      contents: write
    uses: subhamviky/a2c-framework/.github/workflows/aidlc-scaffold.yml@v1.2.0
    with:
      request: ${{ inputs.request }}
      a2c_ref: ${{ inputs.a2c_ref }}

name: aidlc-scaffold

# Runs aidlc-build (E2A AI-DLC pipeline: G2C + P0, then A2C, then E2A checks)
# for one request file and pushes the generated service to the branch
# aidlc/<project_name>. You merge that branch; nothing is installed locally.
on:
  workflow_dispatch:
    inputs:
      request:
        description: "AI-DLC request file, relative to the repository root"
        required: true
        default: "aidlc/requests/settlement-service.json"
      a2c_ref:
        description: "a2c-framework tag to build with"
        required: true
        default: "v1.1.1"

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    env:
      REQUEST: ${{ inputs.request }}
      A2C_REF: ${{ inputs.a2c_ref }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Java (the G2C critic compiles generated Java)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install aidlc-build
        run: pip install "a2c-framework @ git+https://github.com/subhamviky/a2c-framework.git@${A2C_REF}"

      - name: Build the service
        id: build
        run: |
          project=$(python -c "import json, sys; print(json.load(open(sys.argv[1]))['context']['project_name'])" "$REQUEST")
          if [ -e "$project" ]; then
            echo "::error::$project already exists on main; delete it first or use another project_name"
            exit 1
          fi
          aidlc-build --request "$REQUEST" --output .
          # In this multi-service repository only root-level workflows run, so the
          # per-service workflows P0 and A2C generated are kept as documentation.
          mkdir -p "$project/docs/aidlc/generated-workflows"
          mv "$project"/.github/workflows/*.yml "$project/docs/aidlc/generated-workflows/"
          rm -rf "$project/.github"
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - name: Push the scaffold to aidlc/<project>
        env:
          PROJECT: ${{ steps.build.outputs.project }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "aidlc/$PROJECT"
          git add "$PROJECT"
          git commit -m "scaffold: $PROJECT generated by aidlc-build (a2c-framework $A2C_REF)"
          git push origin "aidlc/$PROJECT"

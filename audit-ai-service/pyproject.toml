[tool.poetry]
name = "audit-ai-service"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"
packages = [{include = "audit_ai_service", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12"
"e2a-framework" = { git = "https://github.com/subhamviky/e2a-framework.git", tag = "v1.3.0" }
"capability-oriented-dsa" = { git = "https://github.com/subhamviky/capability-oriented-dsa.git", tag = "v0.2.0" }
"httpx" = ">=0.27"
"fastapi" = ">=0.111"
"uvicorn" = { version = ">=0.30", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
"jsonschema" = ">=4.22"
"pytest" = ">=8.2"
"httpx" = ">=0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

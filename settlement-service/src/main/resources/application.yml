spring:
  application:
    name: settlement-service
  datasource:
    # Local and test database: in-memory H2 in PostgreSQL mode. Production uses
    # application-prod.yml (Azure Database for PostgreSQL).
    url: jdbc:h2:mem:settlement;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
  jpa:
    hibernate:
      ddl-auto: none          # Flyway owns the schema
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

settlement:
  policy:
    max-amount: 1000000.00
    blocked-accounts: ACC-BLOCKED
  clearing:
    max-amount: 250000.00
  adjustments:
    write-off-limit: 5.00             # per settlement, all write-offs together
    write-off-account: ACC-WRITEOFF
  outbox:
    relay-interval-ms: 2000

logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'

# settlement-service — delivery pipeline (generated by A2C CICDAgent).
# test -> iac -> image (build + Trivy scan) -> deploy. The deploy job is
# defined but switched off: it runs only when the repository variable
# DEPLOY_ENABLED is 'true' and OIDC trust to azure has been configured.
name: delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        if: hashFiles('pom.xml') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test (Maven)
        if: hashFiles('pom.xml') != ''
        run: mvn -B verify
      - name: Set up Python
        if: hashFiles('pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test (Poetry)
        if: hashFiles('pyproject.toml') != ''
        run: |
          pipx install "poetry>=2.0,<3"
          poetry install --no-interaction
          poetry run pytest -q

  iac:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
      - run: terraform init -backend=false -input=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform test

  image:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: docker build -t settlement-service:${{ github.sha }} .
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "settlement-service:${{ github.sha }}"
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  deploy:
    runs-on: ubuntu-latest
    needs: [test, iac, image]
    if: vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
      - name: Authenticate to azure with OIDC
        run: echo "Add the azure OIDC login action here once a cloud account exists."
      - name: Deploy
        working-directory: infra
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false
      - name: Roll back on failure
        if: failure()
        run: echo "Re-deploy the previous image tag (rollback) and page the owner."
